name: Accumulation Radar

on:
  schedule:
    # 10:00 Asia/Shanghai
    - cron: "0 2 * * *"
    # Every hour at :30 Asia/Shanghai / UTC
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "oi"
        type: choice
        options:
          - oi
          - pool
          - full

permissions:
  contents: read

concurrency:
  group: accumulation-radar-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      MIHOMO_VERSION: v1.19.23
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore database cache
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: accumulation.db
          key: accumulation-db-${{ github.run_id }}
          restore-keys: |
            accumulation-db-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Start Mihomo proxy
        run: |
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip -c mihomo.gz > mihomo
          chmod +x mihomo
          mkdir -p .github-cache
          printf '%s' "${{ secrets.CLASH_CONFIG_B64 }}" | base64 -d > .github-cache/mihomo.yaml
          nohup ./mihomo -f .github-cache/mihomo.yaml > .github-cache/mihomo.log 2>&1 &
          for _ in $(seq 1 20); do
            if curl -sS --proxy http://127.0.0.1:7897 https://www.gstatic.com/generate_204 >/dev/null; then
              break
            fi
            sleep 1
          done
          echo "HTTPS_PROXY=http://127.0.0.1:7897" >> "$GITHUB_ENV"
          echo "HTTP_PROXY=http://127.0.0.1:7897" >> "$GITHUB_ENV"
          echo "ALL_PROXY=http://127.0.0.1:7897" >> "$GITHUB_ENV"

      - name: Verify upstream access through proxy
        run: |
          curl -fsS --proxy http://127.0.0.1:7897 "https://api.telegram.org/bot${TG_BOT_TOKEN}/getMe" >/tmp/tg.json
          curl -fsS --proxy http://127.0.0.1:7897 "https://fapi.binance.com/fapi/v1/exchangeInfo" >/tmp/exchange.json
          python - <<'PY'
          import json
          with open('/tmp/tg.json') as f:
              tg = json.load(f)
          with open('/tmp/exchange.json') as f:
              ex = json.load(f)
          assert tg.get('ok') is True, tg
          symbols = ex.get('symbols', [])
          assert len(symbols) > 0, ex
          print(f"telegram_ok={tg['result']['username']}")
          print(f"binance_symbols={len(symbols)}")
          PY

      - name: Select mode
        id: select-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then
            echo "mode=pool" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oi" >> "$GITHUB_OUTPUT"
          fi

      - name: Upgrade mode when database is missing
        id: effective-mode
        run: |
          mode="${{ steps.select-mode.outputs.mode }}"
          if [ "$mode" = "oi" ] && [ ! -f accumulation.db ]; then
            mode="full"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run accumulation radar
        run: python accumulation_radar.py "${{ steps.effective-mode.outputs.mode }}"

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: accumulation.db
          key: accumulation-db-${{ github.run_id }}
